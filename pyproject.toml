[project]
name = "conexus"
version = "0.1.0"
description = "CoNexus: risk-aware, memory-augmented multi-agent framework for B2B contract lifecycle automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.70",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "typer>=0.12",
    "rich>=13.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
conexus = "conexus.cli:app"
conexus-api = "conexus.api.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conexus"]
